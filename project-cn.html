            border-radius: 50px;

            align-items: center;
            justify-content: center;
        }
        .animated-box:hover {
            transform: scale(1.05); 
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        @media (max-width: 768px) {
            top-panel {

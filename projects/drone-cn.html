        <h1 style="font-size: large;">定制 FPV 无人机装备</h1>
        <span style="border-top: 2px solid grey; width: 50%;"></span>
        <br>
    </divider>

    <div class="project-container">
        <h2>1. GPS 固定座</h2>
        <div class="media-row">
            <video src="../videos/fpv-gps-holder.mp4" class="media-item" controls loop></video>
            <img src="../images/fpv-gps-holder1.jpg" class="media-item">
            <img src="../images/fpv-gps-holder2.jpg" class="media-item">
        </div>
        <div class="text-column">
            <p>该固定座使用 Fusion 360 设计，并采用 TPU（柔性材料）打印而成。它能在遭受撞击时吸收冲击力，保护 GPS 芯片，同时保持最佳角度以便快速锁定卫星信号。</p>
            <hr>
        </div>
        <h2>2. 飞行眼镜与遥控器收纳盒</h2>
        <div class="media-row">
            <img src="../images/fpv-box1.jpg" class="media-item">
            <img src="../images/fpv-box2.jpg" class="media-item">
            <video src="../videos/fpv-box.mp4" class="media-item" controls loop></video>
        </div>
        <div class="text-column">
            <p>这是一个专为我的 FPV 飞行眼镜和遥控器尺寸定制的硬质收纳盒。可有效防止设备在携带与运输过程中相互刮擦。</p>
            <hr>
        </div>
        <h2>3. 无人机背包外挂绑带</h2>
        <div class="media-row">
            <img src="../images/fpv-bag-strap1.jpg" class="media-item">
            <img src="../images/fpv-bag-strap2.jpg" class="media-item">
            <img src="../images/fpv-bag-strap3.jpg" class="media-item">
        </div>
        <div class="text-column">
            <p>我设计的一套定制的卡扣绑带系统，可安装在背包外部。它能将无人机牢固地固定在包外，从而为背包内部腾出更多空间来存放电池和工具。</p>
        </div>
